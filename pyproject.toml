[project]
name = "laya-service"
description = "One HTTP service that owns the Laya models; every project asks it instead of installing laya itself"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "laya",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/laya_service"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
