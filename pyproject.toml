[project]
name = "laya-service"
description = "One HTTP service that owns the Laya models; every project asks it instead of installing laya itself"
version = "1.0.0"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "laya",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "playwright>=1.40"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true  # runs from src/, installs only the dependencies

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
