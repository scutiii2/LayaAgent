name: test
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # laya is only needed at runtime; tests use fake engines.
      - run: pip install fastapi uvicorn httpx pytest playwright
      - run: playwright install --with-deps chromium
      - run: pytest -q
