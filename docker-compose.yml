# Laya service: N replicas behind one nginx address.
# Start:  docker compose up -d --build          (callers use http://<host>:9120)
# Scale:  LAYA_REPLICAS=3 docker compose up -d --build, then: docker compose restart laya_lb
# Each replica holds its own copy of the models in RAM; the downloaded weights are shared in `models`.

name: laya

services:
  laya:
    build: .
    restart: unless-stopped
    environment:
      LAYA_ADMIN_PASSWORD: ${LAYA_ADMIN_PASSWORD:-}
      LAYA_WARM: "1"
      LAYA_TORCH_THREADS: ${LAYA_TORCH_THREADS:-}
      LAYA_REPLICAS: ${LAYA_REPLICAS:-1}  # shown read-only on /admin/
    volumes:
      - models:/models
      - tokens:/data
    deploy:
      replicas: ${LAYA_REPLICAS:-1}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9120/health')"]
      interval: 15s
      timeout: 5s
      start_period: 120s
    networks: [laya]

  laya_lb:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${LAYA_PORT:-9120}:9120"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      laya:
        condition: service_healthy
    networks: [laya]

volumes:
  models:
  tokens:

# Laya knows nothing about its callers. A caller on the same Docker host reaches it through the published port
# (http://host.docker.internal:9120), or joins the `laya_laya` network on its own side.
networks:
  laya:
