# Load balancer in front of the laya replicas. Docker DNS gives `laya` one address per replica;
# nginx reads them at start, so restart this container after changing the replica count.
upstream laya {
    least_conn;
    server laya:9120 max_fails=2 fail_timeout=10s;
}

server {
    listen 9120;
    client_max_body_size 1m;

    location / {
        proxy_pass http://laya;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Internal-Token $http_x_internal_token;
        proxy_read_timeout 60s;
        # predict is a pure function of its body, so another replica may repeat it.
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }
}
